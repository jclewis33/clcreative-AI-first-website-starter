# Checks-only CI — deploys are handled by Cloudflare Workers Builds, not
# Actions. The build reads content from src/content (the Files source).
name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:config
      - run: npm run check:boundary
      - run: npm run check:content
      - run: npm run check
      - run: npm run build
      - run: npm run check:content-build

  # Fails on any critical advisory in production dependencies.
  #
  # The gate sits at `critical` rather than `high` because the standing high
  # advisories in this tree are not fixable from here: `npm audit` lists
  # devalue, http-cache-semantics, js-yaml, sharp (and miniflare, wrangler and
  # @cloudflare/vite-plugin through it), source-map-js, svgo and undici. They
  # arrive through Astro's, the Cloudflare adapter's and wrangler's own
  # dependencies, so the fix is an upstream release. The Sanity CLI
  # chain is no longer one of them (it ships with the Sanity add-on). Tighten
  # this back to `--audit-level=high` once upstream ships patched releases;
  # check with `npm audit --omit=dev --audit-level=high`.
  #
  # This gate is about the deployed runtime, so it always runs with
  # `--omit=dev`. Review any NEW high advisory on its merits rather than
  # assuming this threshold covers it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
