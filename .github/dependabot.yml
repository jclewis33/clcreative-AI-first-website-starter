version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Supply-chain defense: don't propose a version until it's had time to
    # "bake" on npm. Almost all malicious/compromised package versions are
    # detected and pulled within hours-to-days, so waiting means we never
    # adopt a poisoned release. NOTE: this delays *version* updates only —
    # Dependabot SECURITY updates (CVE fixes) ignore cooldown and still
    # arrive immediately, which is what we want.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # No `ignore` entries: every dependency, Sanity included, tracks current
    # versions through the cooldown above. A Sanity major still deserves a
    # careful review before merging (re-verify the Studio plugins, the desk
    # structure, and the visual-editing islands), but it arrives as a normal
    # PR rather than being blocked at the config level.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
